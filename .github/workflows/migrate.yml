name: Migrate nuclear fuel project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy project from cureflash/tmp
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git clone --depth 1 https://github.com/cureflash/tmp.git "$work/source"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work/source/kakunen-question-scope/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move nuclear fuel project from cureflash/tmp"
          git push origin HEAD:main
