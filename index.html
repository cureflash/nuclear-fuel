<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>核燃料取扱主任者 4択トレ</title>
  <link rel="stylesheet" href="./styles.css?v=20260913-v1">
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">核燃料取扱主任者試験 β</p>
      <h1>核燃 4択トレ</h1>
      <p>検証済み問題を、色彩検定の色トレと同じ流れで反復します。</p>
    </header>

    <section data-view="home">
      <h2>分野</h2>
      <div class="mode-grid" data-role="categories"></div>
      <div class="mode-grid mixed-grid">
        <button type="button" data-category="mixed" disabled>全分野ミックス</button>
      </div>
      <p class="small" data-role="bank-status">問題データを確認中です。</p>
      <p class="small error" data-role="load-error" hidden></p>
    </section>

    <section data-view="quiz" hidden>
      <div class="quiz-head">
        <button type="button" class="quiet" data-action="quit">分野選択へ</button>
        <div class="progress" data-role="progress"></div>
      </div>
      <div class="prompt" data-role="prompt"></div>
      <div class="choices" data-role="choices"></div>
      <div class="explanation" data-role="explanation" hidden></div>
      <button type="button" class="next" data-action="next" hidden>次の問題</button>
    </section>

    <section data-view="result" hidden>
      <h2>結果</h2>
      <p class="result-score" data-role="result"></p>
      <button type="button" data-action="home">分野選択へ戻る</button>
    </section>
  </main>
  <script type="module" src="./app.js?v=20260913-v1"></script>
</body>
</html>
